<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>註冊 - Supabase Sample</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
         background:#f5f5f7; display:flex; justify-content:center; align-items:center;
         height:100vh; margin:0; }
  .card { background:#fff; padding:32px 40px; border-radius:12px;
          box-shadow:0 2px 12px rgba(0,0,0,0.1); width:320px; }
  h1 { font-size:20px; margin-bottom:24px; text-align:center; }
  label { display:block; font-size:13px; color:#555; margin-bottom:4px; margin-top:14px; }
  input { width:100%; padding:10px; border:1px solid #ccc; border-radius:6px;
          font-size:14px; box-sizing:border-box; }
  button { width:100%; margin-top:22px; padding:11px; background:#198754; color:#fff;
           border:none; border-radius:6px; font-size:15px; cursor:pointer; }
  button:hover { background:#157347; }
  .msg { margin-top:14px; font-size:13px; text-align:center; min-height:18px; }
  .msg.error { color:#d33; }
  .msg.ok { color:#2a8a3e; }
  .switch { margin-top:18px; text-align:center; font-size:13px; }
  .switch a { color:#0d6efd; text-decoration:none; }
</style>
</head>
<body>

<div class="card">
  <h1>建立帳號</h1>

  <form id="signupForm">
    <label>帳號（Email）</label>
    <input type="email" id="email" required placeholder="you@example.com">

    <label>密碼</label>
    <input type="password" id="password" required minlength="6" placeholder="至少 6 碼">

    <button type="submit">註冊</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="switch">
    已經有帳號？<a href="index.html">回登入頁</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  const form = document.getElementById("signupForm");
  const msg = document.getElementById("msg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "註冊中...";
    msg.className = "msg";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { data, error } = await supabaseClient.auth.signUp({ email, password });

    if (error) {
      msg.textContent = "註冊失敗：" + error.message;
      msg.className = "msg error";
    } else if (data.user && data.user.identities && data.user.identities.length === 0) {
      // Supabase 的安全設計：email 已註冊過時不會直接回傳 error，
      // 而是回傳「看似成功」但 identities 為空陣列的結果，必須自己判斷這個訊號。
      msg.textContent = "此信箱已經註冊過，請直接登入或使用忘記密碼。";
      msg.className = "msg error";
    } else if (data.user && !data.session) {
      // 正常的新註冊，且 Supabase 要求 email 驗證
      msg.textContent = "註冊成功！請檢查信箱完成驗證後再登入。";
      msg.className = "msg ok";
    } else {
      msg.textContent = "註冊成功，跳轉中...";
      msg.className = "msg ok";
      window.location.href = "dashboard.html";
    }
  });
</script>

</body>
</html>
